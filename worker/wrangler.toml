name = "band-app"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# Serverer frontend-filerne fra public/
[assets]
directory = "../public"
binding = "ASSETS"

# Datalag: ét SQLite-backed Durable Object pr. band + ét master-objekt.
# Namespaces oprettes af selve deployet via [[migrations]] nedenfor — der er
# ingen forberedende `create`-kommando.
[[durable_objects.bindings]]
name = "BAND"
class_name = "BandDO"

[[durable_objects.bindings]]
name = "MASTER"
class_name = "MasterDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["BandDO", "MasterDO"]

# Kun rate-limit tilbage i KV. Sessioner er flyttet ind i BandDO, fordi
# gratisplanens 1.000 KV-skrivninger/dag ellers ramte muren ved 6-7 bands.
[[kv_namespaces]]
binding = "SESSIONS"
id = "c0a52403e89a44ea95e9f94c2e4e900e"

# Natlig oprydning: udløbne sessioner, gammel login-log (efter bandets egen
# opbevaringspolitik) og forældet afstands-cache. Cron virker på Free.
# 02:00 UTC = 03:00 dansk vintertid / 04:00 sommertid.
[triggers]
crons = ["0 2 * * *"]

# Ikke-hemmelige variabler
[vars]
# OMSKIFTNING mellem datalag. Se worker/src/backend.js for hvorfor dette er et
# flag og ikke et big bang: bandenes rigtige data ligger i Apps Scripts Google
# Sheet, og et ubetinget skift ville vise dem en TOM app.
#
#   "sheets"          alle bands på Apps Script (nuværende, sikker standard)
#   "do:dmdt"         KUN dmdt på Durable Objects, resten på Apps Script
#   "do"              alle bands på Durable Objects
#
# Skift ét band ad gangen, og kun når bandets data er lagt ind i det nye lag.
# Tilbagerulning er den samme ændring i modsat retning.
BACKEND = "do"
# Password-KDF. 10000 er verificeret i produktion 2026-08-27: et enkelt hash
# ved 10.000 iterationer gennemføres uden at Cloudflare dræber requesten, altså
# inden for gratisplanens 10 ms CPU. Det er samme styrke som Apps Script bruger
# i dag, så migreringen forringer ikke adgangskodesikkerheden.
#
# Bemærk at tallet IKKE kan verificeres med vægur-tid: Workers fryser uret under
# synkron kørsel, så Date.now() rapporterer 0 ms uanset arbejdet. Testen er
# binær — gennemføres requesten, passede den.
#
# Hæv til 200000 samme dag der skiftes til Workers Paid (30 s CPU). Det er den
# ENESTE ændring der kræves: needsRehash opgraderer hver hash ved næste login,
# fordi hashen gemmer sit eget iterationstal.
PW_ITERATIONS = "10000"
SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzc3u_E4EIZLZXiDoJfSAZyHS0wWJCib_evu98htcSX6qzsZhraxzTIeeQ-gWjpq1o/exec"

# ── SIDECAR ────────────────────────────────────────────────────────────────
# Apps Script-sidecarens /exec-URL. Indtil BEGGE dele er sat (denne var OG
# hemmeligheden SIDECAR_TOKEN) er sidecaren slået fra, og de fire funktioner
# der kræver Google — PDF, Drive-arkivering, afstand, papirkurv — svarer med
# en pæn fejl frem for at gå ned. Se worker/src/services/sidecar.js.
# Samme /exec som SCRIPT_URL ovenfor. Det er MED VILJE: sidecaren overtager
# det eksisterende Apps Script-projekt frem for at få sit eget, og en
# opdateret udrulning beholder sin URL. Opretter man i stedet en NY
# udrulning, skifter URL'en, og denne linje skal rettes.
#
# Harmløs indtil et band faktisk ligger på Durable Objects: sidecaren kaldes
# kun fra det nye datalag, og BACKEND er stadig "sheets".
SIDECAR_URL = "https://script.google.com/macros/s/AKfycbzc3u_E4EIZLZXiDoJfSAZyHS0wWJCib_evu98htcSX6qzsZhraxzTIeeQ-gWjpq1o/exec"

# ── UDGÅENDE MAIL ──────────────────────────────────────────────────────────
# Afsenderadressen Resend sender fra. Kræver at domænet er verificeret med
# SPF/DKIM i Resend — ellers ryger mailen i spam eller afvises.
# Til afprøvning kan "onboarding@resend.dev" bruges uden verificeret domæne,
# men den kan KUN sende til den mailadresse Resend-kontoen er oprettet med.
# MAIL_FROM = "band-app@dit-domaene.dk"

# ── FAKTURAARKIV (R2) ──────────────────────────────────────────────────────
# Arkiverede honorarafregninger. Lå før i operatørens personlige Google Drive —
# se services/archive.js for hvorfor det var forkert.
#
# Bucket'en SKAL oprettes med JURISDIKTION EU — ikke med et "location hint".
# Forskellen er ikke kosmetisk:
#
#   location hint   et ønske om hvor data helst må ligge. Best effort, ingen
#                   garanti, og derfor ubrugeligt som GDPR-argument.
#   jurisdiction    en hård garanti om at objekterne ligger i EU.
#
# Jurisdiktionen er en del af bucket'ens identitet og kan IKKE ændres bagefter —
# kun ved at oprette en ny bucket og kopiere alt over. Præcis samme situation
# som jurisdiction("eu") på Durable Objects.
#
# Linjen nedenfor skal matche bucket'en: uden `jurisdiction` leder Workeren i
# standard-jurisdiktionen og finder ingenting.
#
# Bucket'en må ALDRIG gøres offentlig og må ikke have et r2.dev-domæne. Selvom
# arkivkopien er CPR-fri, er en honorarafregning stadig persondata, og adgangen
# skal gå gennem /api/faktura-arkiv, som kræver login med admin-rolle.
[[r2_buckets]]
binding = "ARCHIVE"
bucket_name = "band-app-arkiv"
jurisdiction = "eu"
